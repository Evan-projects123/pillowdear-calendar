<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASMR Calendar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container">
        <div class="controls">
            <div class="date-navigation">
                <button id="prevMonth" class="arrow-btn" title="Previous Month">&#10094;</button>
                
                <div class="dropdown-container">
                    <span id="monthDisplay" class="month-label"></span>
                    
                    <button id="yearBtn" class="year-display">
                        <span id="yearScroller" class="year-scroller"></span>
                    </button>
                    
                    <div id="yearDropdown" class="dropdown-content">
                    </div>
                </div>

                <button id="nextMonth" class="arrow-btn" title="Next Month">&#10095;</button>
            </div>

            <div class="action-buttons">
                <button id="saveBtn">Save</button>
                <button id="loadBtn">Load</button>
                <button id="exportBtn">Export PNG</button>
                <input type="file" id="fileInput" accept=".json" style="display: none;">
            </div>
        </div>

        <div class="weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div class="calendar-scroll-container">
            <div id="calendarGrid" class="calendar-grid">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
